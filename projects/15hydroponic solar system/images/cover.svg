<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Hydroponic solar system">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f2a"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="400" y="230" text-anchor="middle" fill="#fff" font-family="Poppins, Arial, sans-serif" font-size="42" font-weight="700">Hydroponic</text>
  <text x="400" y="290" text-anchor="middle" fill="#f0ffe8" font-family="Poppins, Arial, sans-serif" font-size="28">solar system</text>
</svg>
